preset_name: "fusion_no_kg_baseline_inverse_vol"
description: "Baseline：Inverse Volatility"

split:
  train_window: 120
  valid_window: 40
  test_horizon: 20
  rebalance_freq: 20

targets:
  horizon: 20

mean_model:
  name: "hist_mean"
  lookback: 60

vol_model:
  name: "ewma_vol"
  lookback: 60
  decay: 0.94
  target_horizon: 20

corr_model:
  name: "pearson"
  psd_eps: 1e-8

optimizer:
  name: "inverse_volatility"
  transaction_cost: 0.001
  charge_initial_cost: true

output:
  experiment_name: "baseline_inverse_volatility"

experiment:
  group: "Baseline"
  variant: "Inverse Volatility"
  paper_tag: "baseline_inverse_volatility"
