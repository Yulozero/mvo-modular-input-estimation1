preset_name: "fusion_no_kg_vol_ewma"
description: "Vol Comparison：EWMA Vol"

split:
  train_window: 120
  valid_window: 40
  test_horizon: 20
  rebalance_freq: 20

targets:
  horizon: 20

mean_model:
  name: "transformer_mean"
  seq_len: 60
  d_model: 64
  n_heads: 4
  n_layers: 2
  epochs: 40
  batch_size: 64
  lr: 0.001
  dropout: 0.1
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  early_stopping_patience: 7
  use_huber_loss: false
  random_state: 42

vol_model:
  name: "ewma_vol"
  lookback: 60
  decay: 0.94
  target_horizon: 20

corr_model:
  name: "pearson"
  psd_eps: 1e-8

optimizer:
  name: "mean_variance"
  gamma: 3.0
  long_only: true
  l2_reg: 0.001
  transaction_cost: 0.001
  charge_initial_cost: true

output:
  experiment_name: "vol_ewma"

experiment:
  group: "Vol Comparison"
  variant: "EWMA Vol"
  paper_tag: "vol_ewma"
