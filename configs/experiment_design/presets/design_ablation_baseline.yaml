preset_name: "design_ablation_baseline"
description: "Ablation: baseline route = Hist Mean + EWMA Vol + Pearson"

mean_model:
  name: "hist_mean"
  lookback: 60

vol_model:
  name: "ewma_vol"
  lookback: 60
  decay: 0.94
  target_horizon: 20

corr_model:
  name: "pearson"
  psd_eps: 1.0e-8

output:
  experiment_name: "design_ablation_baseline"

experiment:
  group: "Ablation"
  variant: "Baseline"
  paper_tag: "design_ablation_baseline"
