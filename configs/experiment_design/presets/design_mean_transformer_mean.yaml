preset_name: "design_mean_transformer_mean"
description: "Mean Comparison: Transformer Mean with fixed EWMA vol and Pearson corr"

mean_model:
  name: "transformer_mean"
  seq_len: 60
  d_model: 64
  n_heads: 4
  n_layers: 2
  epochs: 40
  batch_size: 64
  lr: 0.001
  dropout: 0.1
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  early_stopping_patience: 7
  use_huber_loss: false
  random_state: 42

vol_model:
  name: "ewma_vol"
  lookback: 60
  decay: 0.94
  target_horizon: 20

corr_model:
  name: "pearson"
  psd_eps: 1.0e-8

output:
  experiment_name: "design_mean_transformer_mean"

experiment:
  group: "Mean Comparison"
  variant: "Transformer Mean"
  paper_tag: "design_mean_transformer_mean"
