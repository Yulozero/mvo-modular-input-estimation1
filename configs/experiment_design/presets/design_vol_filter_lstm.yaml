preset_name: "design_vol_filter_lstm"
description: "Vol Comparison: Filter-LSTM with fixed best-mean route and Signed Distance Corr"

vol_model:
  name: "filter_lstm"
  seq_len: 60
  hidden_size: 32
  num_layers: 1
  epochs: 30
  batch_size: 64
  lr: 0.001
  dropout: 0.1
  early_stopping_patience: 5
  smooth_span: 5
  target_horizon: 20
  random_state: 42

output:
  experiment_name: "design_vol_filter_lstm"

experiment:
  group: "Vol Comparison"
  variant: "Filter-LSTM"
  paper_tag: "design_vol_filter_lstm"
