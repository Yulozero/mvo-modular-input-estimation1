preset_name: "design_mean_lstm_mean"
description: "Mean Comparison: LSTM Mean with fixed EWMA vol and Pearson corr"

mean_model:
  name: "lstm_mean"
  seq_len: 60
  hidden_size: 32
  num_layers: 1
  epochs: 30
  batch_size: 64
  lr: 0.001
  dropout: 0.1
  early_stopping_patience: 5
  random_state: 42

vol_model:
  name: "ewma_vol"
  lookback: 60
  decay: 0.94
  target_horizon: 20

corr_model:
  name: "pearson"
  psd_eps: 1.0e-8

output:
  experiment_name: "design_mean_lstm_mean"

experiment:
  group: "Mean Comparison"
  variant: "LSTM Mean"
  paper_tag: "design_mean_lstm_mean"
