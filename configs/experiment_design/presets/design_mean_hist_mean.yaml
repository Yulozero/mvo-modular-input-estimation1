preset_name: "design_mean_hist_mean"
description: "Mean Comparison: Hist Mean with fixed EWMA vol and Pearson corr"

mean_model:
  name: "hist_mean"
  lookback: 60

vol_model:
  name: "ewma_vol"
  lookback: 60
  decay: 0.94
  target_horizon: 20

corr_model:
  name: "pearson"
  psd_eps: 1.0e-8

output:
  experiment_name: "design_mean_hist_mean"

experiment:
  group: "Mean Comparison"
  variant: "Hist Mean"
  paper_tag: "design_mean_hist_mean"
