seed: 42

data:
  returns_path: "data/processed/pool30/returns.csv"
  prices_path: "data/processed/pool30/close.csv"
  market_cap_path: "data/processed/pool30/market_cap.csv"
  realized_vol_path: null

  history_window: 160
  train_window: 120
  valid_window: 40
  test_horizon: 20
  rebalance_freq: 20
  rv_window: 20

split:
  history_window: 160
  train_window: 120
  valid_window: 40
  test_horizon: 20
  rebalance_freq: 20
  mode: "rolling"

targets:
  mean_target: "forward_cum_return"
  vol_target: "forward_realized_vol"
  horizon: 20

kg:
  enabled: false

mean_model:
  name: "hist_mean"
  lookback: 60

vol_model:
  name: "ewma_vol"
  lookback: 60
  decay: 0.94
  target_horizon: 20

corr_model:
  name: "pearson"
  psd_eps: 1e-8

optimizer:
  name: "mean_variance"
  gamma: 3.0
  long_only: true
  l2_reg: 0.001
  transaction_cost: 0.001
  charge_initial_cost: true

backtest:
  mode: "rolling"

evaluation:
  periods_per_year: 12
  daily_periods_per_year: 252

output:
  root_dir: "outputs"
  experiment_name: "base_experiment"

experiment:
  group: "Main"
  variant: "Base"
  paper_tag: "main_base"
