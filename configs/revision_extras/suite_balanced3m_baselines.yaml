suite_name: "balanced3m_baselines_suite"
base: "configs/experiment_design/base_design.yaml"
output:
  root_dir: "outputs_revision_extras"

experiments:
  - preset: "configs/experiment_design/presets/design_main_full_model.yaml"
    override:
      output:
        experiment_name: "balanced3m_full_model"
      data:
        returns_path: "data/processed_balanced3m/pool30/returns.csv"
        prices_path: "data/processed_balanced3m/pool30/close.csv"
        market_cap_path: "data/processed_balanced3m/pool30/market_cap.csv"
      experiment:
        group: "Balanced 3m baselines"
        variant: "Balanced 3m Full Model"

  - preset: "configs/experiment_design/presets/design_baseline_risk_parity.yaml"
    override:
      output:
        experiment_name: "balanced3m_risk_parity"
      data:
        returns_path: "data/processed_balanced3m/pool30/returns.csv"
        prices_path: "data/processed_balanced3m/pool30/close.csv"
        market_cap_path: "data/processed_balanced3m/pool30/market_cap.csv"
      experiment:
        group: "Balanced 3m baselines"
        variant: "Balanced 3m Risk Parity"

  - preset: "configs/experiment_design/presets/design_baseline_traditional_mvo.yaml"
    override:
      output:
        experiment_name: "balanced3m_traditional_mvo"
      data:
        returns_path: "data/processed_balanced3m/pool30/returns.csv"
        prices_path: "data/processed_balanced3m/pool30/close.csv"
        market_cap_path: "data/processed_balanced3m/pool30/market_cap.csv"
      experiment:
        group: "Balanced 3m baselines"
        variant: "Balanced 3m Traditional MVO"

  - preset: "configs/experiment_design/presets/design_baseline_equal_weight.yaml"
    override:
      output:
        experiment_name: "balanced3m_equal_weight"
      data:
        returns_path: "data/processed_balanced3m/pool30/returns.csv"
        prices_path: "data/processed_balanced3m/pool30/close.csv"
        market_cap_path: "data/processed_balanced3m/pool30/market_cap.csv"
      experiment:
        group: "Balanced 3m baselines"
        variant: "Balanced 3m Equal Weight"

  - preset: "configs/experiment_design/presets/design_baseline_min_variance.yaml"
    override:
      output:
        experiment_name: "balanced3m_min_variance"
      data:
        returns_path: "data/processed_balanced3m/pool30/returns.csv"
        prices_path: "data/processed_balanced3m/pool30/close.csv"
        market_cap_path: "data/processed_balanced3m/pool30/market_cap.csv"
      experiment:
        group: "Balanced 3m baselines"
        variant: "Balanced 3m Min Variance"
