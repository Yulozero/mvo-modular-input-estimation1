    override:
      output:
        experiment_name: "liq3m_full_model"
      data:
        returns_path: "data/processed_liquidity3m/pool30/returns.csv"
        prices_path: "data/processed_liquidity3m/pool30/close.csv"
        market_cap_path: "data/processed_liquidity3m/pool30/market_cap.csv"
