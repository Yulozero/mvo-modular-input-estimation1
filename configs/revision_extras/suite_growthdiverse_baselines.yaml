        prices_path: "data/processed_growthdiverse/pool30/close.csv"
        market_cap_path: "data/processed_growthdiverse/pool30/market_cap.csv"
      experiment:
        group: "Growth-diverse baselines"
        variant: "Growth-diverse Traditional MVO"

  - preset: "configs/experiment_design/presets/design_baseline_equal_weight.yaml"
    override:
      output:
        experiment_name: "growthdiverse_equal_weight"
      data:
        returns_path: "data/processed_growthdiverse/pool30/returns.csv"
        prices_path: "data/processed_growthdiverse/pool30/close.csv"
        market_cap_path: "data/processed_growthdiverse/pool30/market_cap.csv"
      experiment:
        group: "Growth-diverse baselines"
        variant: "Growth-diverse Equal Weight"

  - preset: "configs/experiment_design/presets/design_baseline_min_variance.yaml"
    override:
      output:
        experiment_name: "growthdiverse_min_variance"
      data:
        returns_path: "data/processed_growthdiverse/pool30/returns.csv"
