suite_name: "growthdiverse_baselines_suite"
base: "configs/experiment_design/base_design.yaml"
output:
  root_dir: "outputs_revision_extras"

experiments:
  - preset: "configs/experiment_design/presets/design_main_full_model.yaml"
    override:
      output:
        experiment_name: "growthdiverse_full_model"
      data:
        returns_path: "data/processed_growthdiverse/pool30/returns.csv"
        prices_path: "data/processed_growthdiverse/pool30/close.csv"
        market_cap_path: "data/processed_growthdiverse/pool30/market_cap.csv"
      experiment:
        group: "Growth-diverse baselines"
        variant: "Growth-diverse Full Model"

  - preset: "configs/experiment_design/presets/design_baseline_risk_parity.yaml"
    override:
      output:
        experiment_name: "growthdiverse_risk_parity"
      data:
        returns_path: "data/processed_growthdiverse/pool30/returns.csv"
        prices_path: "data/processed_growthdiverse/pool30/close.csv"
        market_cap_path: "data/processed_growthdiverse/pool30/market_cap.csv"
      experiment:
        group: "Growth-diverse baselines"
        variant: "Growth-diverse Risk Parity"

  - preset: "configs/experiment_design/presets/design_baseline_traditional_mvo.yaml"
    override:
      output:
        experiment_name: "growthdiverse_traditional_mvo"
      data:
