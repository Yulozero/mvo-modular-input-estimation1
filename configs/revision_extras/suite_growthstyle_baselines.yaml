        prices_path: "data/processed_growthstyle/pool30/close.csv"
        market_cap_path: "data/processed_growthstyle/pool30/market_cap.csv"
      experiment:
        group: "Growth-style baselines"
        variant: "Growth-style Traditional MVO"

  - preset: "configs/experiment_design/presets/design_baseline_equal_weight.yaml"
    override:
      output:
        experiment_name: "growthstyle_equal_weight"
      data:
        returns_path: "data/processed_growthstyle/pool30/returns.csv"
        prices_path: "data/processed_growthstyle/pool30/close.csv"
        market_cap_path: "data/processed_growthstyle/pool30/market_cap.csv"
      experiment:
        group: "Growth-style baselines"
        variant: "Growth-style Equal Weight"

  - preset: "configs/experiment_design/presets/design_baseline_min_variance.yaml"
    override:
      output:
        experiment_name: "growthstyle_min_variance"
      data:
        returns_path: "data/processed_growthstyle/pool30/returns.csv"
