suite_name: "fusion_no_kg_main_suite"
base: "configs/base.yaml"

experiments:
  - preset: "configs/presets/fusion_no_kg_default.yaml"
    override:
      output:
        experiment_name: "main_full"

  - preset: "configs/presets/fusion_no_kg_mean_hist.yaml"
    override:
      output:
        experiment_name: "mean_hist"

  - preset: "configs/presets/fusion_no_kg_mean_transformer.yaml"
    override:
      output:
        experiment_name: "mean_transformer"

  - preset: "configs/presets/fusion_no_kg_vol_ewma.yaml"
    override:
      output:
        experiment_name: "vol_ewma"

  - preset: "configs/presets/fusion_no_kg_corr_pearson.yaml"
    override:
      output:
        experiment_name: "corr_pearson"
